<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a class="voltar" href="index.html">Voltar</a>

    <div id="containerEstoque">
       
        <div id="titulo">Agendamento</div>

        

        <form id="form-estoque">
            <label for="paciente">Nome do paciente:</label>
            <input type="text" id="paciente" name="paciente" required placeholder="Nome do paciente">

           <label for="tipoConsulta">Consulta:</label>
            <select id="consulta" name="consulta" required>
                <option value="" disabled selected>Selecione a consulta</option>
                <option value="cirurgia">Cirurgia</option>
                <option value="banhoTosa">Banho e Tosa</option>
                <option value="vacina">Vacinação</option>
            </select>

            <label for="responsavel">Responsável:</label>
            <select id="responsavel" name="responsavel" required>
                <option value="" disabled selected>Selecione o responsável</option>
            </select>


            <button type="button" id="adicionar">Agendar</button>
        </form>

                <h2>Consultas Agendadas</h2>
                <form id="form-busca">
                    <input type="text" id="searchInput" placeholder="Digite o nome do paciente">
                    <button type="submit" id="searchButton">Buscar agendamento</button>
                </form>

                <div id="searchResults"></div>

                <h3>Lista de pacientes</h3>
                <ul id="lista-paciente"></ul>

                <script src="estoque.js"></script>

</body>
</html>
